version: "2"

run:
    timeout: 5m

linters:
    default: none
    enable:
        - errcheck
        - govet
        - ineffassign
        - staticcheck
        - unused
        - revive
        - misspell
    settings:
        revive:
            rules:
                - name: exported
                - name: package-comments

formatters:
    enable:
        - gofmt
