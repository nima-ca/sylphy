name: CI

on:
    push:
        branches: [master]
    pull_request:

permissions:
    contents: read

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod
            - run: go vet ./...
            - uses: golangci/golangci-lint-action@v8
              with:
                  version: v2.1

    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: stable
            - run: go build ./...
            - run: go test -race -cover ./...

    fuzz:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: stable
            - run: go test ./internal/protocol -run '^$' -fuzz FuzzReader -fuzztime 20s
